services:
  postgres:
    image: postgres:16-alpine
    container_name: pmcas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pmcas
      POSTGRES_USER: pmcas_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pmcas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmcas_user -d pmcas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pmcas_postgres_data:
